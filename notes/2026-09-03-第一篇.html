<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>第一篇</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
</head>
<body>

<header class="site-header">
  <nav class="nav" aria-label="主選單">
    <a class="nav__brand" href="../index.html">筆記與照片</a>
    <ul class="nav__links">
      <li><a href="../index.html#notes">筆記</a></li>
      <li><a href="../index.html#photos">相簿</a></li>
    </ul>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切換深色 / 淺色模式">
      <span aria-hidden="true">◐</span>
    </button>
  </nav>
</header>

<main>
  <article class="section">
    <div class="wrap wrap--narrow">

      
      <time class="note__date" datetime="2026-09-03">2026-09-03</time>
      <h1 class="note__title">第一篇</h1>

      <!-- 以下是內容。段落用 <p>，其他常用寫法看下面註解： -->
      <p>這是一篇範例筆記，用來確認版面正常。內容可以直接改掉，或是整個檔案刪掉重來。</p>

      <p>要寫新的一篇時，複製 <code>notes/_template.html</code> 另存成新檔名，再到首頁的筆記列表加一行連結就好。</p>

      <!--
        小標題：   <h2>小標題</h2>
        粗體：     <strong>重點</strong>
        連結：     <a href="https://example.com">文字</a>
        清單：     <ul><li>項目一</li><li>項目二</li></ul>
        程式碼：   <pre><code>print("hello")</code></pre>
        圖片：     <img src="../assets/photos/檔名.jpg" alt="說明">
        引用：     <blockquote><p>引用的話</p></blockquote>
      -->

      <p class="note__back"><a href="../index.html#notes">← 回筆記列表</a></p>

    </div>
  </article>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>&copy; <span id="year">2026</span></p>
  </div>
</footer>

<script src="../assets/js/main.js"></script>
</body>
</html>
