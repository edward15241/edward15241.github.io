<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>筆記與照片</title>
<meta name="description" content="放一些筆記和照片的地方。">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
</head>
<body>

<a class="skip-link" href="#main">跳至主要內容</a>

<header class="site-header">
  <nav class="nav" aria-label="主選單">
    <!-- 改這裡：想放站名的話換掉 -->
    <a class="nav__brand" href="#main">筆記與照片</a>
    <ul class="nav__links">
      <li><a href="#notes">筆記</a></li>
      <li><a href="#photos">相簿</a></li>
    </ul>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切換深色 / 淺色模式">
      <span aria-hidden="true">◐</span>
    </button>
  </nav>
</header>

<main id="main">

  <!-- ==================== 筆記 ==================== -->
  <section class="section" id="notes">
    <div class="wrap">
      <h2 class="section__title">筆記</h2>

      <!--
        要新增一篇筆記：
        1. 複製 notes/_template.html，改成新檔名（建議 YYYY-MM-DD-標題.html）
        2. 在裡面寫內容
        3. 回到這裡，複製下面一整個 <li class="entry"> 區塊，改掉日期、標題、連結
        新的放最上面，舊的往下排。
      -->
      <ul class="entries">
        <li class="entry">
          <time class="entry__date" datetime="2026-09-03">2026-09-03</time>
          <a class="entry__title" href="notes/2026-09-03-第一篇.html">第一篇</a>
        </li>
      </ul>
    </div>
  </section>

  <!-- ==================== 相簿 ==================== -->
  <section class="section section--alt" id="photos">
    <div class="wrap">
      <h2 class="section__title">相簿</h2>

      <!--
        要新增照片：
        1. 把圖片檔放進 assets/photos/
        2. 複製下面一個 <li> 區塊，改掉 src 檔名和 alt 說明文字
        alt 是給看不到圖的人（和搜尋引擎）看的，簡短描述照片內容就好。
        目前這六張是示範用的佔位圖，換成真照片後把 assets/photos/sample-*.svg 刪掉。
      -->
      <ul class="gallery">
        <li>
          <button type="button" class="shot" data-full="assets/photos/sample-1.svg">
            <img src="assets/photos/sample-1.svg" alt="示範照片 1" loading="lazy" width="800" height="600">
          </button>
        </li>
        <li>
          <button type="button" class="shot" data-full="assets/photos/sample-2.svg">
            <img src="assets/photos/sample-2.svg" alt="示範照片 2" loading="lazy" width="800" height="600">
          </button>
        </li>
        <li>
          <button type="button" class="shot" data-full="assets/photos/sample-3.svg">
            <img src="assets/photos/sample-3.svg" alt="示範照片 3" loading="lazy" width="800" height="600">
          </button>
        </li>
        <li>
          <button type="button" class="shot" data-full="assets/photos/sample-4.svg">
            <img src="assets/photos/sample-4.svg" alt="示範照片 4" loading="lazy" width="800" height="600">
          </button>
        </li>
        <li>
          <button type="button" class="shot" data-full="assets/photos/sample-5.svg">
            <img src="assets/photos/sample-5.svg" alt="示範照片 5" loading="lazy" width="800" height="600">
          </button>
        </li>
        <li>
          <button type="button" class="shot" data-full="assets/photos/sample-6.svg">
            <img src="assets/photos/sample-6.svg" alt="示範照片 6" loading="lazy" width="800" height="600">
          </button>
        </li>
      </ul>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <p>&copy; <span id="year">2026</span></p>
  </div>
</footer>

<!-- 點縮圖後放大顯示用的圖層 -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox__close" type="button" aria-label="關閉">&times;</button>
  <img class="lightbox__img" id="lightboxImg" src="" alt="">
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
